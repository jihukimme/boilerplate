# version: '3.8' # Docker Compose v2에서는 version 필드가 불필요함

services: # 여러 개의 컨테이너를 정의할 수 있는 블록
  application: # 내부 네트워크에서 application으로 접근 가능
    build:
      context: ./application # Dockerfile이 위치한 경로
    container_name: application-container
    ports:
      - "8080:8080" # 호스트 포트 : 컨테이너 포트 매핑
      - "127.0.0.1:8081:8081" # Actuator 전용 (로컬 및 도커 내부망 전용 보안 설정)
    env_file:
      - path: .env.dev
        required: true
      - path: .env.prod
        required: false
    depends_on:
      mysql: # mysql 서비스가 먼저 시작된 후 application이 실행됨
        condition: service_healthy # mysql 컨테이너가 건강 상태가 좋을 때만 시작
    networks:
      - backend

  mysql: # 내부 네트워크에서 mysql로 접근 가능
    image: mysql:8.0
    container_name: mysql-container
    ports:
      - "3307:3306"
      # 호스트와 컨테이너
      # 호스트 : 도커를 실행하는 실제 물리적 컴퓨터
      # 컨테이너 : 도커가 만든 독립적인 실행 환경(가상 환경)
      # 현재 컨테이너의 3306 포트가 호스트의 3307로 매핑 -> 3307 포트로 MySQL 컨테이너에 접근, 같은 Docker 네트워크에서는 3306 포트로 접근
    env_file:
      - path: .env.dev
        required: true
      - path: .env.prod
        required: false
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

  # --- Monitoring Stack ---
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus-container
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    ports:
      - "9090:9090"
    networks:
      - backend

  grafana:
    image: grafana/grafana:latest
    container_name: grafana-container
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - backend

  loki:
    image: grafana/loki:latest
    container_name: loki-container
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/local-config.yaml
      - loki-data:/loki
    command:
      - '-config.file=/etc/loki/local-config.yaml'
    networks:
      - backend

  promtail:
    image: grafana/promtail:latest
    container_name: promtail-container
    volumes:
      - ./monitoring/promtail-config.yml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock
    command:
      - '-config.file=/etc/promtail/config.yml'
    networks:
      - backend

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter-container
    ports:
      - "9100:9100"
    networks:
      - backend

volumes:
  mysql-data:
  grafana-data:
  prometheus-data:
  loki-data:

networks:
  backend:
    driver: bridge
